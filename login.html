<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unirse al Club</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#f3e8ff,#c084fc,#9333ea);
}

/* caja */
.box{
    width:360px;
    background:white;
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
}

.box h1{
    font-size:28px;
    font-weight:800;
    color:#9333ea;
    margin-bottom:10px;
}

.box p{
    margin-bottom:20px;
    color:#666;
}

.box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ddd;
    outline:none;
}

.btn{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:50px;
    background:linear-gradient(45deg,#c77dff,#9333ea);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
}

.back{
    display:block;
    margin-top:15px;
    font-size:14px;
    color:#555;
    text-decoration:none;
}

.back:hover{
    color:#9333ea;
}

</style>
</head>

<body>

<div class="box">

    <h1>Santa Ponsa Femenino</h1>
    <p>Únete al club</p>

    <input id="name" type="text" placeholder="Nombre">
    <input id="email" type="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Contraseña">

    <button class="btn" onclick="login()">
        Listo
    </button>

    <a class="back" href="index.html">← Volver</a>

</div>

<script>

function login(){

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let pass = document.getElementById("pass").value;

    if(!name || !email || !pass){
        alert("Rellena todos los campos");
        return;
    }

    // guardamos usuario
    localStorage.setItem("user", name);

    // 👉 AQUI ES DONDE CAMBIA TODO
    window.location.href = "home.html";
}

</script>

</body>
</html>
